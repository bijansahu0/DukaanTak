workflows:
  android-release:
    name: DukaanTak Android Release
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
      vars:
        # Codemagic > Environment variables me GOOGLE_SERVICES_JSON add karein
        # (google-services.json ko base64 karke paste karein)
        PACKAGE_NAME: "com.dukaantak.dukaantak"
    scripts:
      - name: google-services.json banana
        script: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Packages lana
        script: flutter pub get
      - name: Release APK build
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
